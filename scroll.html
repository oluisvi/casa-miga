<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#35291f" />
  <meta name="description" content="Miga — uma manhã, capítulo por capítulo." />
  <title>Miga — uma manhã, capítulo por capítulo</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html{scroll-behavior:auto}
    body{background:#35291f;color:#f5f0e7}
    .topbar{position:fixed;z-index:10;background:linear-gradient(#211a14d8,transparent);border:0}
    .journey{height:400vh;position:relative}
    .sticky{height:100svh;min-height:520px;position:sticky;top:0;overflow:hidden;background:#35291f url("hero-still.png") center/cover no-repeat}
    .visual,.visual video,.visual:after{position:absolute;inset:0}
    .visual video{width:100%;height:100%;object-fit:cover;filter:brightness(.74) saturate(.92)}
    .visual:after{content:"";background:linear-gradient(90deg,#241b14d8 0%,#241b1468 49%,#241b1415 100%),linear-gradient(0deg,#241b14a8,transparent 34%)}
    .hud{position:absolute;z-index:2;inset:0;padding:15vh var(--gutter) 10vh;display:flex;flex-direction:column;justify-content:center;pointer-events:none;transition:opacity .35s ease}
    .hud small,.counter,.cue{font:10px "DM Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:#fff0df}
    .hud small{color:#edaa6b}
    .hud h1{font:500 clamp(64px,10vw,140px)/.88 "Playfair Display",serif;letter-spacing:-.05em;max-width:950px;margin:25px 0}
    .hud h1 em{color:#edaa6b;font-weight:500}
    .hud p{font:15px/1.75 "DM Sans",sans-serif;color:#f1e7d9;max-width:390px;margin:0}
    .counter,.cue{position:absolute;bottom:38px}
    .counter{left:var(--gutter)}.cue{right:var(--gutter)}
    .progress{position:absolute;z-index:4;top:0;left:0;width:100%;height:3px;background:#e7a36b;transform:scaleX(0);transform-origin:left}
    .chapters{display:none}
    .chapters article{min-height:70vh;padding:12vh 0;display:flex;flex-direction:column;justify-content:center;max-width:730px;border-bottom:1px solid #27241f24}
    .chapters article:nth-child(even){margin-left:auto;text-align:right;align-items:flex-end}
    .chapters small{font:10px "DM Mono",monospace;letter-spacing:.16em;color:#b06a39}
    .chapters h2{font:500 clamp(47px,7.4vw,94px)/.94 "Playfair Display",serif;letter-spacing:-.04em;margin:22px 0}
    .chapters p{font:15px/1.75 "DM Sans",sans-serif;max-width:430px;color:#615c53}
    .chapters a{margin-top:16px;color:#27241f;font:10px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid #27241f;padding:12px 0}
    .topbar nav a:focus-visible,.topbar a:focus-visible,.chapters a:focus-visible{outline:2px solid #edaa6b;outline-offset:5px}
    @media(max-width:650px){.journey{height:400vh}.hud{padding:16vh 24px 9vh}.hud h1{font-size:clamp(59px,14vw,78px)}.hud p{max-width:310px;font-size:14px}.counter,.cue{bottom:25px;font-size:8px}.chapters article{min-height:60vh}.chapters article:nth-child(even){text-align:left;align-items:flex-start}}
    @media(prefers-reduced-motion:reduce){.journey{height:100svh}.sticky{height:100svh;position:relative}.visual video{display:none}.progress{display:none}.cue{display:none}.chapters article{min-height:55vh}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">miga<span>✳</span></a>
    <nav><a href="#chapters">Capítulos</a></nav>
    <a class="order" href="index.html">Voltar à Miga ↗</a>
  </header>
  <main>
    <section class="journey" id="journey" aria-label="Vídeo narrativo da Miga controlado pelo scroll">
      <div class="sticky">
        <div class="progress" id="progress"></div>
        <div class="visual" aria-hidden="true">
          <video id="storyVideo" muted playsinline preload="auto" poster="hero-still.png">
            <source src="media/miga-story.mp4" type="video/mp4" />
          </video>
        </div>
        <div class="hud">
          <small id="kicker">01 / CAPÍTULO</small>
          <h1 id="title">A manhã começa<br /><em>devagar.</em></h1>
          <p id="copy">A primeira luz encontra o pão que descansou a noite inteira.</p>
          <div class="counter" id="counter">01 — 04</div>
          <div class="cue">Role para avançar a cena ↓</div>
        </div>
      </div>
    </section>
    <section class="chapters" id="chapters" aria-label="Capítulos da história"></section>
  </main>
  <script>
    const scenes=[
      {n:"01",title:"A manhã começa devagar.",copy:"A primeira luz encontra o pão que descansou a noite inteira."},
      {n:"02",title:"O café pede presença.",copy:"Água quente, grão recém-moído e alguns minutos sem olhar o celular."},
      {n:"03",title:"O forno dá o sinal.",copy:"Camadas douradas, cheiro bom e o balcão ficando pronto."},
      {n:"04",title:"Tem lugar para mais um.",copy:"Uma xícara, um pão quentinho e o tempo para sentar."}
    ];
    const journey=document.querySelector("#journey"),video=document.querySelector("#storyVideo"),chapters=document.querySelector("#chapters"),reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
    scenes.forEach((scene,i)=>{const article=document.createElement("article");article.innerHTML="<small>"+scene.n+" / CAPÍTULO</small><h2>"+scene.title+"</h2><p>"+scene.copy+"</p>"+(i===3?'<a href="index.html#visite">PASSE PRA UM CAFÉ ↗</a>':"");chapters.append(article)});
    let raf=0,lastProgress=0;
    function update(){raf=0;const rect=journey.getBoundingClientRect(),range=Math.max(journey.offsetHeight-innerHeight,1),progress=Math.min(1,Math.max(0,-rect.top/range)),index=Math.min(scenes.length-1,Math.floor(progress*scenes.length));lastProgress=progress;document.querySelector("#kicker").textContent=scenes[index].n+" / CAPÍTULO";document.querySelector("#title").innerHTML=scenes[index].title.replace(/\.(?=\s|$)/,"<em>.</em>");document.querySelector("#copy").textContent=scenes[index].copy;document.querySelector("#counter").textContent=scenes[index].n+" — 04";document.querySelector("#progress").style.transform="scaleX("+progress+")";if(!reduceMotion&&Number.isFinite(video.duration)&&video.duration>0){const target=Math.min(video.duration-.04,progress*video.duration);if(Math.abs(video.currentTime-target)>.12)video.currentTime=target}}
    function queueUpdate(){if(!raf)raf=requestAnimationFrame(update)}
    addEventListener("scroll",queueUpdate,{passive:true});addEventListener("resize",queueUpdate);video.addEventListener("loadedmetadata",()=>{if(!reduceMotion)video.currentTime=lastProgress*video.duration});update();
  </script>
</body>
</html>
